# Build und Tests auf einem macOS-Runner. Keine Signatur, keine Notarisierung;
# das macht nur der Release-Workflow (release.yml) bei Tags v*, siehe dev/RELEASING.md.
#
# Performance-Tests (Filter "Performance|performance", wie in scripts/check.sh)
# laufen hier nicht: Ihre Grenzen (z. B. Layout von 2 Mio. Knoten unter 50 ms,
# Vergleich unter 2 s) sind auf einem lokalen Apple-Silicon-Rechner kalibriert.
# Die geteilten GitHub-Runner (3 vCPUs, wechselnde Last) schwanken stark, die
# Tests wären dort unzuverlässig. Sie bleiben Teil von scripts/check.sh, das vor
# jedem Commit und in scripts/release.sh läuft.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Geprüft 10/2026: Image macos-26-arm64, Xcode 26.6 (Swift 6.3.3).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Neuestes stabiles Xcode: Der Code nutzt Swift 6 im Strict-Concurrency-Modus.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
          # Package.swift setzt -plugin-path nur bei aktiven Command Line Tools.
          # Mit Xcode darf der Zusatz nicht auftauchen:
          if swift package dump-package | grep -q -- '-plugin-path'; then
            echo "::error::Package.swift setzt -plugin-path, obwohl Xcode aktiv ist"
            exit 1
          fi

      - name: swift build
        run: swift build

      - name: swift test (ohne Performance-Tests)
        run: swift test --skip 'Performance|performance'

      # GitHub-Variante (universal, mit Sparkle). Ohne Zertifikat signiert
      # make-app.sh ad hoc; ohne Resources/sparkle-public-ed-key.txt nur mit Warnung.
      - name: GitHub-Variante (ad hoc, universal, mit Sparkle)
        run: |
          DISKRINGS_ADHOC=1 scripts/make-app.sh
          APP=build/DiskRings.app
          test "$(lipo -archs "$APP/Contents/MacOS/DiskRings" | wc -w | tr -d ' ')" = 2
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          otool -L "$APP/Contents/MacOS/DiskRings" | grep -q '@rpath/Sparkle.framework/'
          otool -l "$APP/Contents/MacOS/DiskRings" | grep -q '@executable_path/../Frameworks'
          plutil -extract SUFeedURL raw "$APP/Contents/Info.plist" | grep -qx 'https://github.com/brokoskokoli/diskrings/releases/latest/download/appcast.xml'
          codesign --verify --deep --strict "$APP"

      - name: Appcast- und Sparkle-Skripte testen
        run: scripts/test-make-appcast.sh

      # Mac-App-Store-Variante (Sandbox), damit sie nicht unbemerkt bricht. Ohne
      # Zertifikate auf dem Runner signiert make-app.sh ad hoc mit den
      # Sandbox-Entitlements und baut ein unsigniertes .pkg (siehe dev/APPSTORE.md).
      # Kein Sparkle in der Store-Variante (Apple lehnt Selbst-Updater ab):
      # make-app.sh prüft das selbst, hier zusätzlich unabhängig.
      - name: App-Store-Variante (ad hoc, ohne Sparkle)
        run: |
          scripts/make-app.sh --appstore
          APP=build/appstore/DiskRings.app
          ENTITLEMENTS=$(codesign -d --entitlements - "$APP" 2>/dev/null)
          grep -q "com.apple.security.app-sandbox" <<<"$ENTITLEMENTS"
          plutil -extract ITSAppUsesNonExemptEncryption raw "$APP/Contents/Info.plist" | grep -qx false
          PKG="build/DiskRings-$(tr -d '[:space:]' < VERSION).pkg"
          test -f "$PKG"
          if find "$APP" -iname '*sparkle*' | grep -q .; then echo "::error::Sparkle-Dateien im Store-Bündel"; exit 1; fi
          if otool -L "$APP/Contents/MacOS/DiskRings" | grep -qi sparkle; then echo "::error::Store-Binary gegen Sparkle gelinkt"; exit 1; fi
          if strings -a "$APP/Contents/MacOS/DiskRings" | grep -qE 'SUFeedURL|SUPublicEDKey|SUEnable|SPU[A-Z][A-Za-z]+|[Ss]parkle'; then echo "::error::Sparkle-Zeichenketten im Store-Binary"; exit 1; fi
          if grep -q '<key>SU' "$APP/Contents/Info.plist"; then echo "::error::Sparkle-Schlüssel in der Store-Info.plist"; exit 1; fi
          if pkgutil --payload-files "$PKG" | grep -qi sparkle; then echo "::error::Sparkle im Store-Paket"; exit 1; fi
